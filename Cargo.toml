[package]
name = "slimspot"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
bytes = "1"
# Software renderer only (no GPU, no accessibility backend); see CLAUDE.md for the RAM measurement.
freya = { version = "=0.5.0-rc.10", default-features = false, features = ["winit", "tray"] }
http = "1"
http-body-util = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
librespot = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
log = "0.4"
# Inflates the update zip; already in the tree via png.
miniz_oxide = "0.8"
rsa = "0.9.10"
serde_json = "1"
sha2 = { version = "0.10.9", features = ["oid"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
opt-level = "s"
lto = true

[target.'cfg(windows)'.dependencies]
# Both already in the tree (windows via cpal/winit, raw-window-handle via winit); only extra modules compile.
windows = { version = "=0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
raw-window-handle = "0.6"

# Day-to-day builds: same optimisation level, no LTO, parallel + incremental codegen.
# `cargo build --profile fast`; the real release (LTO) is for measuring RAM and size.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[target.'cfg(target_os = "linux")'.dependencies]
# All already in the Linux tree with these features (zbus via Freya's mundy, rfd via freya-winit,
# libc via cpal/alsa); no new crates.
libc = "0.2"
rfd = "0.17"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
