[package]
name = "slimspot"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
log = "0.4"
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-default", "renderer-software", "compat-1-2", "raw-window-handle-06", "system-tray"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
opt-level = "s"
lto = true

[target.'cfg(windows)'.dependencies]
# Both already in the tree (windows via cpal/winit, raw-window-handle via slint); only extra modules compile.
windows = { version = "=0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

# Day-to-day builds: same optimisation level, no LTO, parallel + incremental codegen.
# `cargo build --profile fast`; the real release (LTO) is for measuring RAM and size.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
