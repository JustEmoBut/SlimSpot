<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>SlimSpot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5cf08f"/>
      <stop offset="0.6" stop-color="#1ed760"/>
      <stop offset="1" stop-color="#119c45"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- The "spot": a glowing disc with slim equalizer bars cut into it. -->
  <circle cx="128" cy="128" r="80" fill="#1ed760" opacity="0.35" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="80" fill="url(#spot)"/>
  <g fill="#0f0f0f">
    <rect x="85"  y="112" width="14" height="32"  rx="7"/>
    <rect x="109" y="84"  width="14" height="88"  rx="7"/>
    <rect x="133" y="64"  width="14" height="128" rx="7"/>
    <rect x="157" y="94"  width="14" height="68"  rx="7"/>
  </g>
</svg>
